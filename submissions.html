<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions - Academic Validator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .back-btn, .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover, .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .submissions-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .submission-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .submission-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.processed {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .submission-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .submission-info {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .info-value {
            color: #999;
            word-break: break-all;
        }

        .submission-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-btn {
            background: #667eea;
            color: white;
        }

        .view-btn:hover {
            background: #5568d3;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .delete-btn:hover {
            background: #ee5a52;
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 25px;
        }

        .empty-state-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .empty-state-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .submissions-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📋 Submissions</h1>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="/" class="back-btn">← Back to Upload</a>
                <button class="refresh-btn" onclick="loadSubmissions()">🔄 Refresh</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterSubmissions('all')">All</button>
            <button class="filter-btn" onclick="filterSubmissions('pending')">⏳ Pending</button>
            <button class="filter-btn" onclick="filterSubmissions('processed')">✅ Processed</button>
            <button class="filter-btn" onclick="filterSubmissions('failed')">❌ Failed</button>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading submissions...</p>
            </div>
        </div>
    </div>

    <script>
        // API Configuration - automatically detects environment
        const API_BASE_URL = (() => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:5000';
            }
            // For Render or other production deployments
            return window.location.origin.replace('validator-ixxm', 'academic-validator-backend').replace('onrender.com', 'onrender.com');
        })();

        let allSubmissions = [];
        let currentFilter = 'all';

        async function loadSubmissions() {
            try {
                const response = await fetch(`${API_BASE_URL}/list`);
                const data = await response.json();
                allSubmissions = data || [];
                displaySubmissions();
            } catch (error) {
                console.error('Error loading submissions:', error);
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h2>Error Loading Submissions</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function filterSubmissions(filter) {
            currentFilter = filter;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displaySubmissions();
        }

        function displaySubmissions() {
            const filtered = currentFilter === 'all'
                ? allSubmissions
                : allSubmissions.filter(s => s.folder === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h2>No Submissions</h2>
                        <p>No ${currentFilter === 'all' ? '' : currentFilter} submissions yet.</p>
                        <a href="/" class="empty-state-btn">Upload Your First Problem</a>
                    </div>
                `;
                return;
            }

            const cards = filtered.map(submission => `
                <div class="submission-card">
                    <span class="status-badge ${submission.folder}">${getStatusIcon(submission.folder)} ${submission.folder}</span>
                    <div class="submission-title">${submission.filename}</div>
                    <div class="submission-info">
                        <div class="info-row">
                            <span class="info-label">Size:</span>
                            <span class="info-value">${formatFileSize(submission.file_size)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Uploaded:</span>
                            <span class="info-value">${formatDate(submission.timestamp)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Hash:</span>
                            <span class="info-value" style="font-family: monospace; font-size: 11px;">${submission.hash.substring(0, 16)}...</span>
                        </div>
                        ${submission.processing_result ? `
                        <div class="info-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee;">
                            <span class="info-label">Result:</span>
                            <span class="info-value" style="max-height: 80px; overflow-y: auto; display: block; margin-top: 5px;">${submission.processing_result.substring(0, 150)}${submission.processing_result.length > 150 ? '...' : ''}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="submission-actions">
                        <button class="action-btn view-btn" onclick="viewSubmission('${submission.filename}')">View</button>
                        <button class="action-btn delete-btn" onclick="deleteSubmission('${submission.filename}')">Delete</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('content').innerHTML = `<div class="submissions-grid">${cards}</div>`;
        }

        function getStatusIcon(status) {
            const icons = {
                'pending': '⏳',
                'processed': '✅',
                'failed': '❌'
            };
            return icons[status] || '📄';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function viewSubmission(filename) {
            window.open(`${API_BASE_URL}/download/${filename}`, '_blank');
        }

        async function deleteSubmission(filename) {
            if (confirm(`Are you sure you want to delete ${filename}? This cannot be undone.`)) {
                try {
                    const response = await fetch(`${API_BASE_URL}/delete/${filename}`, { method: 'DELETE' });
                    if (response.ok) {
                        allSubmissions = allSubmissions.filter(s => s.filename !== filename);
                        displaySubmissions();
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error}`);
                    }
                } catch (error) {
                    alert(`Delete failed: ${error.message}`);
                }
            }
        }

        loadSubmissions();
        setInterval(loadSubmissions, 5000);
    </script>
</body>
</html>
