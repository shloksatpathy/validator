<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Validator - Upload Problem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .upload-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .upload-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-btn-file {
            background: #667eea;
            color: white;
        }

        .upload-btn-file:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-btn-camera {
            background: #764ba2;
            color: white;
        }

        .upload-btn-camera:hover {
            background: #653a8a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        input[type="file"],
        input[type="checkbox"] {
            display: none;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #764ba2;
            background: #f0ebff;
        }

        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .drop-zone-text {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .drop-zone-text strong {
            display: block;
            color: #333;
            margin-bottom: 4px;
        }

        .file-list {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .file-item-name {
            color: #333;
            flex: 1;
            word-break: break-all;
        }

        .file-item-size {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: background 0.3s ease;
        }

        .remove-btn:hover {
            background: #ee5a52;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .settings {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
        }

        .settings-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .settings-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 8px;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #667eea;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="checkbox"]:checked + .custom-checkbox {
            background: #667eea;
            color: white;
        }

        .submissions-link {
            text-align: center;
            margin-top: 20px;
        }

        .submissions-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .submissions-link a:hover {
            color: #764ba2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .upload-btn {
                min-width: 100%;
            }

            .drop-zone {
                padding: 30px 15px;
            }

            .drop-zone-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Academic Validator</h1>
            <p>Upload your problem solutions from any device</p>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="upload-section">
            <button class="upload-btn upload-btn-file" onclick="document.getElementById('fileInput').click()">
                📄 Choose File
            </button>
            <button class="upload-btn upload-btn-camera" onclick="document.getElementById('cameraInput').click()">
                📷 Take Photo
            </button>
        </div>

        <input type="file" id="fileInput" multiple accept=".json,.txt,.py,.cpp,.java,.js,.pdf,.md,.png,.jpg,.jpeg,.gif,.bmp,.webp" />
        <input type="file" id="cameraInput" accept="image/*" capture="environment" />

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">⬆️</div>
            <div class="drop-zone-text">
                <strong>Drag and drop files here</strong>
                or click to browse
            </div>
        </div>

        <div class="file-list" id="fileList">
            <div id="emptyState" style="color: #999; font-size: 13px; padding: 10px;">
                No files selected yet
            </div>
        </div>

        <button class="submit-btn" id="submitBtn" disabled onclick="uploadFiles()">
            Upload Problem
        </button>

        <div class="settings">
            <div class="settings-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="autoProcessCheck" />
                    <span class="custom-checkbox" onclick="toggleCheckbox('autoProcessCheck')">✓</span>
                    <span>Auto-process after upload</span>
                </label>
            </div>
            <div class="settings-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="notifyCheck" />
                    <span class="custom-checkbox" onclick="toggleCheckbox('notifyCheck')">✓</span>
                    <span>Notify when completed</span>
                </label>
            </div>
        </div>

        <div class="submissions-link">
            <a href="/submissions">View All Submissions</a>
        </div>
    </div>

    <script>
        // API Configuration - automatically detects environment
        const API_BASE_URL = (() => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:5000';
            }
            // For Render or other production deployments
            return window.location.origin.replace('validator-ixxm', 'academic-validator-backend').replace('onrender.com', 'onrender.com');
        })();

        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        const dropZone = document.getElementById('dropZone');
        const fileList = document.getElementById('fileList');
        const emptyState = document.getElementById('emptyState');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let selectedFiles = [];

        function toggleCheckbox(id) {
            const checkbox = document.getElementById(id);
            checkbox.checked = !checkbox.checked;
        }

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            updateFileList();
        });

        cameraInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFiles.push(...Array.from(e.target.files));
                updateFileList();
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            selectedFiles = Array.from(e.dataTransfer.files);
            updateFileList();
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        function updateFileList() {
            emptyState.style.display = selectedFiles.length === 0 ? 'block' : 'none';

            const fileItems = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <span class="file-item-name">${file.name}</span>
                    <span class="file-item-size">${formatFileSize(file.size)}</span>
                    <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
                </div>
            `).join('');

            fileList.innerHTML = fileItems || '<div id="emptyState" style="color: #999; font-size: 13px; padding: 10px;">No files selected yet</div>';
            submitBtn.disabled = selectedFiles.length === 0;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) {
                showMessage('No files selected', 'error');
                return;
            }

            submitBtn.disabled = true;
            progressBar.classList.add('show');
            let completedUploads = 0;
            const uploadedFiles = [];
            const autoProcess = document.getElementById('autoProcessCheck').checked;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch(`${API_BASE_URL}/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    completedUploads++;
                    const progress = (completedUploads / selectedFiles.length) * 100;
                    progressFill.style.width = progress + '%';

                    if (response.ok) {
                        const data = await response.json();
                        uploadedFiles.push(data.filename);
                        console.log(`✓ ${file.name} uploaded successfully`);
                    } else {
                        const error = await response.json();
                        console.error(`✗ ${file.name}: ${error.error}`);
                    }
                } catch (error) {
                    console.error(`✗ ${file.name}: ${error.message}`);
                }
            }

            progressFill.style.width = '100%';

            if (autoProcess && uploadedFiles.length > 0) {
                showMessage(`Uploaded! Processing with Gemini API...`, 'info');

                for (const filename of uploadedFiles) {
                    try {
                        const processResponse = await fetch(`${API_BASE_URL}/process/${filename}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ prompt_type: 'validator' })
                        });

                        if (processResponse.ok) {
                            const processData = await processResponse.json();
                            console.log(`✓ ${filename} processed:`, processData.result);
                        } else {
                            const error = await processResponse.json();
                            console.error(`✗ Processing failed for ${filename}:`, error.error);
                        }
                    } catch (error) {
                        console.error(`✗ Processing error for ${filename}:`, error.message);
                    }
                }

                showMessage(`Successfully processed all files! 🎉`, 'success');
            } else {
                showMessage(`Successfully uploaded ${completedUploads}/${selectedFiles.length} file(s)! 🎉`, 'success');
            }

            setTimeout(() => {
                selectedFiles = [];
                updateFileList();
                submitBtn.disabled = true;
                progressBar.classList.remove('show');
                progressFill.style.width = '0%';
            }, 2000);
        }

        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message show ${type}`;
            setTimeout(() => {
                statusMessage.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
